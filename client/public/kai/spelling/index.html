<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kai's Spelling</title>
<style>
:root{
  --bg:#faf7f2; --card:#fff; --ink:#22201d; --muted:#6f6a63; --line:#e6e0d6;
  --accent:#2f6f4e; --accent-soft:#e4f0e9;
  --warn:#b5661a; --warn-soft:#fbeee0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161a; --card:#211f24; --ink:#f0ece6; --muted:#9d968c; --line:#332f38;
    --accent:#6fc494; --accent-soft:#1e3329;
    --warn:#e8a765; --warn-soft:#3a2c1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
}
.wrap{max-width:640px;margin:0 auto;padding-top:28px}
.screen{display:none}
.screen.on{display:block}

/* ---------- shared ---------- */
h1{font-size:26px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:16px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px;box-shadow:var(--shadow)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.btn{display:block;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:20px;font-size:20px;font-weight:600;text-align:left;
  box-shadow:var(--shadow);transition:transform .08s ease,border-color .15s ease}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.99)}
.btn small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:3px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary small{color:rgba(255,255,255,.85)}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:10px 16px;font-size:16px;min-height:44px}
.mini:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- start ---------- */
#start .card{text-align:center;padding:44px 24px}
#start .big{font-size:52px;margin-bottom:8px}

/* ---------- week picker ---------- */
.weekpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
#start .weekpick{justify-content:center}
.weekpick button{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:9px 15px;font-size:15px;min-height:42px;
  transition:border-color .15s ease}
.weekpick button:hover{border-color:var(--accent)}
.weekpick button.on{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent);font-weight:600}

/* ---------- home ---------- */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}
.days{color:var(--accent);font-weight:600;font-size:16px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.tally{display:flex;gap:18px;font-size:15px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.tally b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.wd{font-weight:600;line-height:1.25}
.mn{color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px;
    max-width:38ch}
.tick{color:var(--accent);font-weight:700;margin-left:5px}
td.acc{width:92px;padding-left:14px;text-align:right;vertical-align:middle}
/* named .meter, NOT .bar — .bar is already the round header strip above */
.meter{width:78px;height:7px;border-radius:4px;background:var(--line);
     overflow:hidden;margin-left:auto}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent);
       transition:width .3s ease}
.meter.mid i{background:#c9a227}
.meter.low i{background:var(--warn)}
.pct{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap}

/* Speak-it button in the word table. Sized for a finger, not a cursor. */
.play{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;width:34px;height:34px;font-size:15px;line-height:1;
  margin-left:8px;vertical-align:middle;padding:0;
  transition:border-color .15s ease,transform .08s ease}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play:active{transform:scale(.92)}
.play.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- mode switch ---------- */
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:5px;margin-bottom:18px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:11px 8px;border-radius:9px;font-size:16px;
  font-weight:600;color:var(--muted);text-align:center;transition:background .15s ease}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}

/* three tabs now — keep them on one line on a phone */
@media (max-width:400px){ .seg button{font-size:14px;padding:11px 4px} }

/* ---------- one-by-one rows ---------- */
.solo{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 13px;
  box-shadow:var(--shadow)}
.solo.next{border-color:var(--accent);border-width:2px;background:var(--accent-soft)}
.solo .n{flex:none;min-width:20px;font-size:13px;color:var(--muted);text-align:right}
.solo .txt{flex:1;min-width:0}
.solo .nm{font-weight:600;font-size:17px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.solo .sz{font-size:13px;color:var(--muted);display:block;margin-top:1px}
.solo .acts{display:flex;gap:7px;flex:none}
.solo .acts .mini{padding:9px 12px;font-size:16px;min-height:40px}
.solo.done .nm{color:var(--muted)}
.solo .wstars{letter-spacing:1px}

/* ---------- level cards ---------- */
.lv{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;box-shadow:var(--shadow);text-align:left}
.lv.next{border-color:var(--accent);border-width:2px;background:var(--accent-soft)}
.lvtop{display:flex;align-items:center;gap:13px}
.lv .ico{font-size:26px;flex:none;line-height:1}
.lv .txt{flex:1;min-width:0}
.lv .nm{font-weight:600;font-size:18px;display:block}
.lv .ws{font-size:14px;color:var(--muted);margin-top:2px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv .rt{flex:none;text-align:right;font-size:16px;letter-spacing:1px}
.legend{font-size:13px;color:var(--muted);text-align:center;
  margin:2px 0 0;line-height:1.7}
.lvacts{display:flex;gap:8px;margin-top:12px}
.lvacts .mini{flex:1;text-align:center;padding:11px 6px}
.mini.go{border-color:var(--accent);color:var(--accent);font-weight:600}
.stars{font-size:34px;letter-spacing:6px;margin-bottom:6px;min-height:40px}
.star-off{opacity:.22}
.streak{color:var(--warn);font-weight:600}

/* ---------- break prompt ---------- */
.breakbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;
  padding:14px 16px;font-size:16px;font-weight:600;margin-bottom:20px}

/* ---------- collapsible word table ---------- */
.more{margin-top:26px}
.more summary{cursor:pointer;font-size:15px;color:var(--muted);padding:6px 0;
  list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:"▸ ";color:var(--muted)}
.more[open] summary:before{content:"▾ "}
.more summary:hover{color:var(--accent)}
.reset{margin-top:22px;font-size:14px;color:var(--muted);text-decoration:underline}

/* ---------- round ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;
  font-size:15px;color:var(--muted);margin-bottom:24px}
.quit{font-size:15px;color:var(--muted);text-decoration:underline}
.stage{text-align:center;padding:10px 0 4px;min-height:104px;
  display:flex;flex-direction:column;justify-content:center;gap:10px}
.word{font-size:46px;font-weight:700;letter-spacing:-.02em;word-break:break-word;line-height:1.15}
.chunks{font-size:19px;color:var(--muted);letter-spacing:.04em}
.mean{font-size:17px;color:var(--muted);max-width:34ch;margin:0 auto}
.hintbox{background:var(--accent-soft);border-radius:12px;padding:12px 16px;
  text-align:center;max-width:none;color:var(--ink);font-size:17px}
.hintbox .chunks{font-size:17px}
[hidden]{display:none !important}
.hidden-word{font-size:44px;color:var(--line);letter-spacing:.14em}
/* NB: must be longhand — `font: 600 30px/1.3 inherit` is invalid CSS
   (inherit isn't a legal family inside the shorthand) and gets dropped
   wholesale, leaving the browser's tiny default input font. */
input{
  width:100%;
  font-family:inherit; font-size:36px; font-weight:600; line-height:1.2;
  color:inherit; text-align:center; letter-spacing:.01em;
  background:var(--bg); border:2px solid var(--line); border-radius:14px;
  padding:22px 16px; margin:20px 0 16px; outline:none;
}
@media (max-width:480px){ input{ font-size:30px; padding:18px 12px } }
input:focus{border-color:var(--accent)}
input.bad{border-color:var(--warn)}

/* ---------- feedback ---------- */
.fb{margin-top:6px}
.fbrow{display:flex;align-items:center;gap:12px;margin-bottom:8px;
  font-size:15px;color:var(--muted)}
.fbrow .lbl{width:82px;flex:none;text-align:right}
.cells{display:flex;gap:3px;flex-wrap:wrap;font:600 26px/1 ui-monospace,Menlo,monospace}
.c{min-width:.72em;padding:5px 3px;border-radius:5px;text-align:center}
.c.ok{color:var(--ink)}
.c.bad{background:var(--warn-soft);color:var(--warn)}
.c.gap{background:var(--warn-soft);color:var(--warn);opacity:.55}
.c.sp{min-width:.4em}
.verdict{font-size:22px;font-weight:700;margin-bottom:14px}
.verdict.good{color:var(--accent)}
.verdict.miss{color:var(--warn)}
.note{font-size:15px;color:var(--muted);margin:10px 0 16px}
.note.retry-ask{color:var(--warn);font-weight:600;font-size:17px;margin-bottom:10px}

/* ---------- done ---------- */
#done .card{text-align:center;padding:40px 24px}
#done .big{font-size:52px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ START (primes speech; browsers need a tap) ============ -->
  <section id="start" class="screen on">
    <div class="card">
      <div class="big">📣</div>
      <h1>Kai's Spelling</h1>
      <p class="sub" style="margin:10px 0 18px">Week of <span data-week></span> &middot; <span data-count></span> words</p>
      <div class="weekpick" data-weeks></div>
      <button class="btn primary" id="go" style="text-align:center">Tap to start</button>
      <p class="sub" style="margin-top:16px;font-size:14px">Turn the sound on 🔊</p>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="home" class="screen">
    <div class="head">
      <div>
        <h1>Kai's Spelling</h1>
        <div class="sub">Week of <span data-week></span> &middot; <span data-count></span> words</div>
      </div>
      <div class="days" id="days"></div>
    </div>

    <div class="weekpick" data-weeks></div>

    <div class="seg" id="seg">
      <button data-view="one">1️⃣ One</button>
      <button data-view="levels">🎮 Level</button>
      <button data-view="all">📋 All</button>
    </div>

    <div class="stack" data-view-panel="one" hidden>
      <button class="btn primary" id="solo-go" style="text-align:left"></button>
      <div id="solos" class="stack" style="margin-bottom:0"></div>
      <p class="legend">Shortest words first. Each one: copy it, then spell it blind.<br>
        ⭐⭐⭐ right first try &middot; ⭐⭐ second try &middot; ⭐ third try &middot; latest score shown</p>
    </div>

    <div class="stack" id="levels" data-view-panel="levels"></div>

    <div class="stack" data-view-panel="all" hidden>
      <button class="btn primary" id="test-all">✍️ Test all <span data-count></span>
        <small id="test-sub">Hear the word, type it — no peeking</small></button>
      <button class="btn" id="practice-all">📖 Practice all <span data-count></span>
        <small>See the word and copy it</small></button>
    </div>

    <details class="more">
      <summary>All <span data-count></span> words &amp; how you're doing</summary>
      <div class="card" style="margin-top:12px">
        <div class="tally" id="tally"></div>
        <table id="list"></table>
        <button class="reset" id="reset">Start this week over</button>
      </div>
    </details>
  </section>

  <!-- ============ READY (warm-up done, now spell them blind) ============ -->
  <section id="ready" class="screen">
    <div class="card" style="text-align:center;padding:40px 24px">
      <div class="big" style="font-size:52px;margin-bottom:10px">🙈</div>
      <h1>Now without looking!</h1>
      <p class="sub" style="margin:12px auto 24px;max-width:30ch" id="ready-sub"></p>
      <button class="btn primary" id="ready-go" style="text-align:center">I'm ready →</button>
      <button class="reset" id="ready-later" style="margin-top:16px">Just warming up — go home</button>
    </div>
  </section>

  <!-- ============ ROUND ============ -->
  <section id="round" class="screen">
    <div class="bar">
      <span id="pos"></span>
      <button class="quit" id="quit">Finish</button>
    </div>

    <div class="card">
      <div class="stage" id="stage"></div>
      <div class="mean hintbox" id="hintbox" hidden></div>

      <input id="ans" type="text" inputmode="text"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="go" aria-label="Type the word">

      <div class="row" id="tools">
        <button class="mini" id="again">🔊 Again</button>
        <button class="mini" id="slow">🐢 Slower</button>
        <button class="mini" id="hint">💡 Hint</button>
        <button class="mini" id="skip">⏭ Later</button>
      </div>

      <div class="fb" id="fb" style="display:none"></div>
    </div>
  </section>

  <!-- ============ DONE / reward ============ -->
  <section id="done" class="screen">
    <div class="card">
      <div class="big" id="done-emoji">🎉</div>
      <div class="stars" id="done-stars"></div>
      <h1 id="done-title"></h1>
      <p class="sub" style="margin:12px 0 20px" id="done-sub"></p>
      <div id="done-break" class="breakbox" hidden></div>
      <div class="stack" id="done-actions"></div>
    </div>
  </section>

</div>

<script>
/* ============================================================
   WORD BANK — one entry per weekly test. Append the new week to the
   END; never edit or delete an old one, because each week's progress
   and stars are stored under its own `week` string.
   w = word   m = short kid meaning   c = syllable chunks (optional)
   Levels run shortest words first — he types slowly, so early wins
   matter more than covering the list fast. ~4-5 words each: warm up
   by copying them, then spell them blind. About 3 minutes.
   ============================================================ */
const WEEKS = [
  {
    week: "Aug 28",
    date: "2026-08-28",
    words: [
      { w:"line",         m:"one row of words in a poem" },
      { w:"stanza",       m:"a group of lines in a poem",                    c:"stan·za" },
      { w:"alliteration", m:"words next to each other starting with the same sound", c:"al·lit·er·a·tion" },
      { w:"rhyme",        m:"words that end with the same sound" },
      { w:"rhythm",       m:"the beat of a poem",                            c:"rhy·thm" },
      { w:"imagery",      m:"words that make a picture in your mind",        c:"im·age·ry" },
      { w:"onomatopoeia", m:"a word that sounds like its noise — buzz, splash", c:"on·o·mat·o·poe·ia" },
      { w:"infer",        m:"to figure out from clues" },
      { w:"splattered",   m:"splashed in drops",                             c:"splat·tered" },
      { w:"depend",       m:"to need something" },
      { w:"glazed",       m:"covered with something shiny" },
      { w:"wheelbarrow",  m:"a small cart with one wheel",                   c:"wheel·bar·row" },
      { w:"gist",         m:"the main idea" },
      { w:"characteristics", m:"what someone or something is like",          c:"char·ac·ter·is·tics" },
      { w:"contrast",     m:"to show how things are different",              c:"con·trast" },
      { w:"theme",        m:"the big idea of a story" },
      { w:"repetition",   m:"saying something again and again",              c:"rep·e·ti·tion" },
      { w:"details",      m:"small pieces of information",                   c:"de·tails" },
      { w:"purchase",     m:"to buy",                                        c:"pur·chase" },
      { w:"community",    m:"a group of people living in one place",         c:"com·mu·ni·ty" },
      { w:"deliver",      m:"to bring something to someone",                 c:"de·liv·er" },
      { w:"figurative language", m:"words that mean something other than what they say", c:"fig·ur·a·tive" },
    ],
    levels: [
      { n:1, name:"Short & Sweet",  emoji:"🌱", ws:["line","gist","rhyme","theme","infer"] },
      { n:2, name:"Six Letters",    emoji:"🌿", ws:["stanza","depend","glazed","rhythm","details"] },
      { n:3, name:"Getting Longer", emoji:"🌳", ws:["imagery","deliver","purchase","contrast"] },
      { n:4, name:"Big Words",      emoji:"⛰️", ws:["community","splattered","repetition","wheelbarrow"] },
      { n:5, name:"Champion Words", emoji:"🏔️", ws:["alliteration","onomatopoeia","characteristics","figurative language"] },
    ],
  },

  /* Week 3 sheet. The last seven were marked ▲ — carried over from earlier
     weeks, so they are the ones he is expected to already know. */
  {
    week: "Sep 4",
    date: "2026-09-04",
    words: [
      { w:"figurative language", m:"words that mean something other than what they say", c:"fig·ur·a·tive" },
      { w:"anonymous",    m:"written by someone whose name we don't know",   c:"a·non·y·mous" },
      { w:"create",       m:"to make something new",                         c:"cre·ate" },
      { w:"free verse",   m:"a poem with no rhyme and no set beat" },
      { w:"evidence",     m:"proof from the text that shows you're right",   c:"ev·i·dence" },
      { w:"repetition",   m:"saying something again and again",              c:"rep·e·ti·tion" },
      { w:"fearful",      m:"full of fear — scared",                          c:"fear·ful" },
      { w:"in depth",     m:"using a lot of details, complete" },
      { w:"prose",        m:"ordinary writing in sentences, not poetry" },
      { w:"pretend",      m:"to act as if something is real",                c:"pre·tend" },
      { w:"chomp",        m:"to bite down hard and noisily" },
      { w:"chores",       m:"small jobs you do around the house" },
      { w:"iambic meter", m:"a beat that goes da-DUM, da-DUM, da-DUM",       c:"i·am·bic me·ter" },
      { w:"onomatopoeia", m:"a word that sounds like its noise — buzz, splash", c:"on·o·mat·o·poe·ia" },
      { w:"alliteration", m:"words next to each other starting with the same sound", c:"al·lit·er·a·tion" },
      { w:"rhyme",        m:"words that end with the same sound" },
      { w:"rhythm",       m:"the beat of a poem — its meter",                 c:"rhy·thm" },
      { w:"imagery",      m:"words that make a picture in your mind",        c:"im·age·ry" },
      { w:"theme",        m:"the big idea of a story" },
      { w:"characteristics", m:"what someone or something is like",          c:"char·ac·ter·is·tics" },
    ],
    levels: [
      { n:1, name:"Short & Sweet",  emoji:"🌱", ws:["chomp","prose","rhyme","theme"] },
      { n:2, name:"Six Letters",    emoji:"🌿", ws:["create","chores","rhythm","fearful"] },
      { n:3, name:"Getting Longer", emoji:"🌳", ws:["pretend","imagery","in depth","evidence"] },
      { n:4, name:"Big Words",      emoji:"⛰️", ws:["anonymous","free verse","repetition","iambic meter"] },
      { n:5, name:"Champion Words", emoji:"🏔️", ws:["alliteration","onomatopoeia","characteristics","figurative language"] },
    ],
  },

  /* Week 6 sheet. The last fifteen are marked ▶ — most carried over from
     Sep 4. "rhythm (meter)" is tested as rhythm alone, as on Aug 28. */
  {
    week: "Sep 18",
    date: "2026-09-18",
    words: [
      { w:"figurative language", m:"words that mean something other than what they say", c:"fig·ur·a·tive" },
      { w:"persuade",     m:"to get someone to agree with you or do something", c:"per·suade" },
      { w:"empathy",      m:"feeling what someone else is feeling",          c:"em·pa·thy" },
      { w:"compassion",   m:"caring when someone is hurting and wanting to help", c:"com·pas·sion" },
      { w:"reflect",      m:"to think carefully about something",            c:"re·flect" },
      { w:"slobber",      m:"to let spit drip out of your mouth, like a dog", c:"slob·ber" },
      { w:"groceries",    m:"food and things you buy at the store",          c:"gro·cer·ies" },
      { w:"miracle",      m:"an amazing thing that seems impossible",        c:"mir·a·cle" },
      { w:"prompt",       m:"the question or idea you are asked to write about" },
      { w:"response",     m:"an answer",                                     c:"re·sponse" },
      { w:"flattered",    m:"pleased because someone said nice things about you", c:"flat·tered" },
      { w:"inspire",      m:"to give someone the idea or wish to do something", c:"in·spire" },
      { w:"simile",       m:"comparing two things using \"like\" or \"as\"", c:"sim·i·le" },
      { w:"metaphor",     m:"comparing two things by saying one IS the other", c:"met·a·phor" },
      { w:"elaborate",    m:"to explain with more details",                  c:"e·lab·o·rate" },
      { w:"free verse",   m:"a poem with no rhyme and no set beat" },
      { w:"evidence",     m:"proof from the text that shows you're right",   c:"ev·i·dence" },
      { w:"repetition",   m:"saying something again and again",              c:"rep·e·ti·tion" },
      { w:"prose",        m:"ordinary writing in sentences, not poetry" },
      { w:"onomatopoeia", m:"a word that sounds like its noise — buzz, splash", c:"on·o·mat·o·poe·ia" },
      { w:"alliteration", m:"words next to each other starting with the same sound", c:"al·lit·er·a·tion" },
      { w:"rhyme",        m:"words that end with the same sound" },
      { w:"rhythm",       m:"the beat of a poem — its meter",                 c:"rhy·thm" },
      { w:"imagery",      m:"words that make a picture in your mind",        c:"im·age·ry" },
      { w:"theme",        m:"the big idea of a story" },
      { w:"characteristics", m:"what someone or something is like",          c:"char·ac·ter·is·tics" },
    ],
    levels: [
      { n:1, name:"Short & Sweet",  emoji:"🌱", ws:["prose","rhyme","theme","simile"] },
      { n:2, name:"Six Letters",    emoji:"🌿", ws:["prompt","rhythm","inspire","reflect"] },
      { n:3, name:"Getting Longer", emoji:"🌳", ws:["slobber","empathy","miracle","imagery"] },
      { n:4, name:"Climbing Up",    emoji:"🌲", ws:["persuade","response","evidence","metaphor"] },
      { n:5, name:"Big Words",      emoji:"⛰️", ws:["groceries","flattered","free verse","elaborate","compassion"] },

/* The active week. Everything below reads these, not WEEKS directly. */
let WEEK, TEST_DATE, WORDS, LEVELS;

const byWord  = w => WORDS.find(o => o.w === w);
const wordsOf = n => LEVELS[n-1].ws.map(byWord);

/* One at a time, shortest first — the gentlest way in on a bad day.
   Count letters, not characters, so the order matches the "7 letters" label on
   each row; a two-word phrase then sits after single words of the same length.
   sort() is stable, so exact ties keep the sheet's own order. */
const letters    = o => o.w.replace(/ /g,"").length;
const soloOrder  = () => WORDS.slice()
  .sort((a,b) => letters(a)-letters(b) || a.w.length-b.w.length);
const soloAfter  = w => { const o = soloOrder(); return o[o.findIndex(x=>x.w===w)+1] || null; };
/* Where "Start one by one" picks up: the first word not yet learned. */
const soloFirst  = () => soloOrder().find(o => stats[o.w].score < GOAL) || soloOrder()[0];

const GOAL = 2;   // spell it right twice and it's done

/* ============================================================
   Storage — keyed by week, so a new list starts clean
   ============================================================ */
/* v2 = levels added. Bumping the key retires the old flat shape cleanly
   rather than migrating a few practice attempts. */
const LAST = "kai-spelling:last-week";   // which week was open last time
let KEY = "";
let stats = {};      // per word
let stars = {};      // per level: best star count, 0-3
/* Per word, from One-by-one. Unlike levels this is the LATEST result, not the
   best — it's meant to show how he'd spell it today. */
let wordStars = {};
let view  = "levels";// which home view he last used

const fresh = () => ({score:0, tries:0, hits:0, errs:[], skips:0});

function load(){
  let d = {};
  try{ d = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){}
  stats = d.stats || {};
  stars = d.stars || {};
  wordStars = d.wordStars || {};
  view  = d.view  || "levels";
  WORDS.forEach(o=>{ stats[o.w] = stats[o.w] || fresh(); });
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({stats, stars, wordStars, view})); }catch(e){}
}
/* Must drop the stored copy BEFORE rebuilding — calling load() here would just
   read last week's data straight back in and save() would re-persist it. */
function wipe(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  stats = {}; stars = {}; wordStars = {};
  WORDS.forEach(o=>{ stats[o.w] = fresh(); });
  save();
}

/* Open on the next test that hasn't happened yet; once the last one is past,
   stay on it. A week Kai picked by hand wins over both. */
function defaultWeek(){
  let saved = null;
  try{ saved = localStorage.getItem(LAST); }catch(e){}
  if(WEEKS.some(w => w.week === saved)) return saved;

  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = WEEKS.filter(w => new Date(w.date+"T00:00:00") >= today)
                        .sort((a,b) => a.date < b.date ? -1 : 1)[0];
  return (upcoming || WEEKS[WEEKS.length-1]).week;
}

function setWeek(name){
  const wk = WEEKS.find(w => w.week === name) || WEEKS[WEEKS.length-1];
  WEEK = wk.week; TEST_DATE = wk.date; WORDS = wk.words; LEVELS = wk.levels;
  KEY = "kai-spelling:v2:" + WEEK;
  try{ localStorage.setItem(LAST, WEEK); }catch(e){}
  load();
}

/* ============================================================
   Speech — the whole reason this app exists
   ============================================================ */
let voice = null, canSpeak = ("speechSynthesis" in window);

function pickVoice(){
  if(!canSpeak) return;
  const v = speechSynthesis.getVoices();
  if(!v.length) return;
  voice = v.find(x=>x.name==="Samantha")
       || v.find(x=>x.lang==="en-US" && x.localService)
       || v.find(x=>x.lang==="en-US")
       || v.find(x=>x.lang && x.lang.startsWith("en"))
       || v[0];
}
if(canSpeak){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

const NORMAL = 0.85, SLOW = 0.1;   // 0.1 = the slowest the spec allows

function say(text, rate){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    /* The gap matters. Queueing an utterance in the same tick as cancel() makes
       Chrome and Safari fall back to default settings — the word still plays, so
       "Again" sounds fine and only "Slower" appears broken. */
    setTimeout(()=>{
      const u = new SpeechSynthesisUtterance(text);
      u.rate   = Math.max(0.1, Math.min(2, rate || NORMAL));
      u.pitch  = 1;
      u.volume = 1;
      u.lang   = "en-US";
      if(voice) u.voice = voice;
      speechSynthesis.speak(u);
    }, 60);
  }catch(e){}
}

/* The whole word, just very slowly. Reading it syllable-by-syllable sounded odd
   and quietly handed over the chunking that 💡 Hint is supposed to cost him. */
function saySlow(o){ say(o.w, SLOW); }

/* If no voice ever shows up, Test mode flashes the word instead of speaking it.
   Degraded, but it still works. */
let noVoice = false;
setTimeout(()=>{
  if(!canSpeak || !speechSynthesis.getVoices().length) noVoice = true;
}, 1600);

/* ============================================================
   Letter-level diff — the feature that beats paper.
   Levenshtein with backtrace, so a single missing letter is reported as
   ONE missing letter, not "everything after it is wrong".
   ============================================================ */
function align(a, b){                       // a = typed, b = correct
  const n=a.length, m=b.length;
  const dp = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=0;i<=n;i++) dp[i][0]=i;
  for(let j=0;j<=m;j++) dp[0][j]=j;
  for(let i=1;i<=n;i++)
    for(let j=1;j<=m;j++)
      dp[i][j] = (a[i-1]===b[j-1])
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);

  const ops=[]; let i=n, j=m;
  while(i>0 || j>0){
    if(i>0 && j>0 && a[i-1]===b[j-1] && dp[i][j]===dp[i-1][j-1]){
      ops.push({t:"ok", a:a[i-1], b:b[j-1]}); i--; j--;
    } else if(i>0 && j>0 && dp[i][j]===dp[i-1][j-1]+1){
      ops.push({t:"sub", a:a[i-1], b:b[j-1]}); i--; j--;
    } else if(j>0 && dp[i][j]===dp[i][j-1]+1){
      ops.push({t:"miss", a:null, b:b[j-1]}); j--;      // he left a letter out
    } else {
      ops.push({t:"extra", a:a[i-1], b:null}); i--;     // he added a letter
    }
  }
  return ops.reverse();
}

const norm = s => s.trim().toLowerCase().replace(/\s+/g," ");

function cell(ch, cls){
  if(ch === null) return `<span class="c gap">·</span>`;
  if(ch === " ")  return `<span class="c sp"></span>`;
  return `<span class="c ${cls}">${ch}</span>`;
}

function renderDiff(typed, correct){
  const ops = align(typed, correct);
  const top = ops.map(o =>
    o.t==="ok"    ? cell(o.a,"ok")
  : o.t==="miss"  ? cell(null)
  :                 cell(o.a,"bad")).join("");
  const bot = ops.map(o =>
    o.t==="ok"    ? cell(o.b,"ok")
  : o.t==="extra" ? cell(null)
  :                 cell(o.b,"bad")).join("");

  // Name the single most useful correction, when there is exactly one.
  const wrong = ops.filter(o=>o.t!=="ok");
  let note = "";
  if(wrong.length===1){
    const o = wrong[0];
    note = o.t==="miss"  ? `You missed the <b>${o.b}</b>.`
         : o.t==="extra" ? `There's an extra <b>${o.a}</b>.`
         :                 `It's <b>${o.b}</b>, not <b>${o.a}</b>.`;
  } else if(wrong.length && wrong.length<=3){
    note = "Look at the orange letters.";
  }

  return `
    <div class="fbrow"><span class="lbl">You typed</span><span class="cells">${top || cell(null)}</span></div>
    <div class="fbrow"><span class="lbl">Correct</span><span class="cells">${bot}</span></div>
    ${note ? `<div class="note">${note}</div>` : ""}`;
}

/* ============================================================
   Screens
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const show = id => $$(".screen").forEach(s => s.classList.toggle("on", s.id===id));

function daysLeft(){
  const t = new Date(TEST_DATE+"T00:00:00");
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/86400000);
}

const starRow = n => "★★★".split("").map((s,i)=>
  `<span class="${i<n?"":"star-off"}">${s}</span>`).join("");

/* The level to nudge him toward: first one not yet 3-starred. */
function nextLevel(){
  const l = LEVELS.find(L => (stars[L.n]||0) < 3);
  return l ? l.n : LEVELS.length;
}

function renderWeeks(){
  $$("[data-weeks]").forEach(box=>{
    box.innerHTML = WEEKS.map(w =>
      `<button data-wk="${w.week}"${w.week===WEEK ? ' class="on"' : ""}>${w.week}</button>`
    ).join("");
    Array.from(box.children).forEach(b => b.onclick = ()=>{
      setWeek(b.dataset.wk);
      renderAll();
      setView(view);
    });
  });
}

/* Week label, counts, pills, levels and table all move together. */
function renderAll(){
  renderWeeks();
  $$("[data-week]").forEach(e => e.textContent = WEEK);
  $$("[data-count]").forEach(e => e.textContent = WORDS.length);
  renderHome();
}

function renderLevels(){
  const nxt = nextLevel();
  $("#levels").innerHTML = LEVELS.map(L=>{
    const got  = stars[L.n] || 0;
    const done = L.ws.filter(w => stats[w].score >= GOAL).length;
    const isNext = L.n === nxt;
    return `<div class="lv ${isNext?"next":""}">
      <div class="lvtop">
        <span class="ico">${L.emoji}</span>
        <span class="txt">
          <span class="nm">${L.name}</span>
          <span class="ws">${L.ws.length} words · ${done} learned</span>
        </span>
        <span class="rt">${got ? starRow(got) : ""}</span>
      </div>
      <div class="lvacts">
        <button class="mini" data-level="${L.n}" data-go="practice">📖 Warm up</button>
        <button class="mini go" data-level="${L.n}" data-go="test">✍️ Spell it</button>
      </div>
    </div>`;
  }).join("") +
  `<p class="legend">⭐ spell every word &middot; ⭐⭐ at most one slip &middot; ⭐⭐⭐ all right first try<br>
    Shows your latest run of the level, not your best.</p>`;
  $$("#levels [data-go]").forEach(b =>
    b.onclick = ()=> startLevel(+b.dataset.level, b.dataset.go));
}

function renderSolos(){
  const order = soloOrder();
  const nxt   = soloFirst();

  $("#solos").innerHTML = order.map((o,i)=>{
    const done = stats[o.w].score >= GOAL;
    const got  = wordStars[o.w];        // undefined until he has spelled it blind
    return `<div class="solo ${o===nxt?"next":""} ${done?"done":""}">
      <span class="n">${i+1}</span>
      <span class="txt">
        <span class="nm">${o.w}${done?`<span class="tick">✓</span>`:""}</span>
        <span class="sz">${letters(o)} letters${
          got===undefined ? "" : ` &middot; <span class="wstars">${starRow(got)}</span>`}</span>
      </span>
      <span class="acts">
        <button class="mini" data-solo="${o.w}" data-sgo="practice" title="Warm up">📖</button>
        <button class="mini go" data-solo="${o.w}" data-sgo="test" title="Spell it">✍️</button>
      </span>
    </div>`;
  }).join("");

  $$("#solos [data-solo]").forEach(b =>
    b.onclick = ()=> startSolo(b.dataset.solo, b.dataset.sgo));

  const left = order.filter(o => stats[o.w].score < GOAL).length;
  $("#solo-go").innerHTML = left < order.length
    ? `▶️ Keep going: ${nxt.w}<small>${left} word${left===1?"":"s"} still to nail</small>`
    : `▶️ Start one by one<small>${order.length} words, shortest first</small>`;
  $("#solo-go").onclick = ()=> startSolo(soloFirst().w, "practice");
}

function renderHome(){
  const need = WORDS.filter(o => stats[o.w].score < GOAL).length;
  const done = WORDS.length - need;
  const shaky = WORDS.filter(o => stats[o.w].score===0 && stats[o.w].tries>0).length;

  const d = daysLeft();
  $("#days").textContent =
    d > 1 ? d+" days to go" : d===1 ? "Tomorrow!" : d===0 ? "Test today!" : "";

  renderLevels();
  renderSolos();

  $("#test-sub").textContent = need
    ? `${need} word${need===1?"":"s"} still to nail`
    : "All done — go again to keep it sharp";

  $("#tally").innerHTML =
    `<span><b>${done}</b> done</span>
     <span><b>${need-shaky}</b> in progress</span>
     <span><b>${shaky}</b> tricky</span>`;

  $("#list").innerHTML = WORDS.map(o=>{
    const s   = stats[o.w];
    const pct = s.tries ? Math.round(100 * s.hits / s.tries) : null;
    const cls = pct === null ? "" : pct >= 80 ? "" : pct >= 50 ? "mid" : "low";
    const tick  = s.score >= GOAL ? `<span class="tick">✓</span>` : "";
    const label = pct === null ? "not tried" : `${pct}% · ${s.hits}/${s.tries}`;
    // Misspellings still recorded — moved to a hover tooltip instead of the row.
    const tip = s.errs.length ? ` title="typed: ${s.errs.join(", ")}"` : "";
    return `<tr${tip}>
      <td><div class="wd">${o.w}${tick}${canSpeak ? `<button class="play" data-say="${o.w}"
            aria-label="Say ${o.w}">🔊</button>` : ""}</div><div class="mn">${o.m}</div></td>
      <td class="acc">
        <div class="meter ${cls}"><i style="width:${pct || 0}%"></i></div>
        <div class="pct">${label}</div>
      </td></tr>`;
  }).join("");

  /* Tapping one lights it up until the word has been read out, so he can see
     which row is talking — several taps in a row otherwise look like nothing
     happened while the previous word finishes. */
  $$("#list [data-say]").forEach(b => b.onclick = ()=>{
    $$("#list .play.on").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    say(b.dataset.say);
    setTimeout(()=> b.classList.remove("on"), 1400);
  });
}

/* ============================================================
   A round
   ============================================================ */
let mode="test", queue=[], at=0, phase="input", hinted=false, tally={right:0,wrong:0};
let levelNo=0, streak=0, sessionStart=0;
/* The single word being worked in One-by-one mode, or null. */
let solo=null;
/* Per word this round: how many cold, blind asks it took, and which ask he
   finally got it on. Retyping during a correction doesn't count — the right
   spelling is on screen then. Drives the per-word stars in every test mode. */
let asks={}, gotAt={};
/* Words actually spelled right in this pass. Stars depend on this, not on the
   miss count — skipping every word leaves zero misses, which used to read as
   a flawless level. */
let solved=new Set();

/* A level runs in two passes over the SAME few words:
   warm up by copying them, then spell them blind. The repetition is the point —
   he asked to get familiar with a handful rather than face the whole list cold. */
function startLevel(n, go){
  levelNo = n; solo = null;
  if(!sessionStart) sessionStart = Date.now();
  if(go === "test") return startTestPass();   // straight to the blind pass
  mode = "practice";
  queue = wordsOf(n);
  at = 0; streak = 0; solved = new Set(); asks = {}; gotAt = {}; tally = {right:0,wrong:0};
  show("round");
  step();
}

function startTestPass(){
  mode = "test";
  queue = wordsOf(levelNo).slice().sort(()=>Math.random()-0.5);
  at = 0; streak = 0; solved = new Set(); asks = {}; gotAt = {}; tally = {right:0,wrong:0};
  show("round");
  step();
}

/* One word, the same two passes: copy it, then spell it blind. Same shape as a
   level, just a queue of one — for the days when five words is four too many. */
function startSolo(w, go){
  solo = byWord(w); levelNo = 0;
  if(!solo) return;
  if(!sessionStart) sessionStart = Date.now();
  if(go === "test") return startSoloTest();
  mode = "practice";
  queue = [solo]; at = 0; streak = 0; solved = new Set(); asks = {}; gotAt = {}; tally = {right:0,wrong:0};
  show("round");
  step();
}

function startSoloTest(){
  mode = "test";
  queue = [solo]; at = 0; streak = 0; solved = new Set(); asks = {}; gotAt = {}; tally = {right:0,wrong:0};
  show("round");
  step();
}

/* "Test all" stays available for later in the week. */
function startRound(m){
  levelNo = 0; solo = null;
  if(!sessionStart) sessionStart = Date.now();
  mode = m;
  let pool = (m==="practice")
    ? WORDS.slice()
    : WORDS.filter(o=>stats[o.w].score<GOAL);

  if(!pool.length) pool = WORDS.slice();          // all done → free practice

  if(m==="test"){
    // Shuffle, then float the words he's struggling with toward the front.
    pool.sort(()=>Math.random()-0.5);
    pool.sort((a,b)=>rank(a)-rank(b));
  }
  queue = pool; at = 0; streak = 0; solved = new Set(); asks = {}; gotAt = {}; tally = {right:0,wrong:0};
  show("round");
  step();
}

/* Ordering for "Test all": words he's actually missing come first, and
   within each group the easier levels lead — he types slowly, so early wins
   matter more than front-loading the monsters. */
const levelOf = w => LEVELS.findIndex(L => L.ws.includes(w));

function rank(o){
  const s = stats[o.w], lv = levelOf(o.w);
  if(s.tries && s.score===0) return lv;        //   0-4  known-bad, easiest first
  if(s.score < GOAL)         return 10 + lv;   // 10-14  not yet learned
  return 100;                                  //        already solid, last
}

function current(){ return queue[at]; }

/* Bumped on every word. The auto-advance timer captures the value it was
   scheduled under, so a timer left over from an earlier word can never
   advance a later one — that raced with Enter and skipped words. */
let gen = 0;

function step(){
  if(at >= queue.length){
    /* A level ends only when every one of its words has actually been spelled.
       Deferred words included — skipping postpones, it never excuses. */
    if(levelNo && mode==="test"){
      const missing = wordsOf(levelNo).filter(o => !solved.has(o.w));
      if(missing.length) queue.push(...missing);
    }
    if(at >= queue.length) return finish();
  }
  gen++;
  phase="input"; hinted=false;

  const o = current();
  const where = solo
    ? `1️⃣ ${mode==="practice" ? "Warm up" : "Spell it"}`
    : levelNo
    ? `${LEVELS[levelNo-1].emoji} ${mode==="practice" ? "Warm up" : "Spell it"}`
    : "All words";
  const fire = streak >= 3 ? ` <span class="streak">🔥 ${streak} in a row</span>` : "";
  $("#pos").innerHTML = `${where} · ${at+1}/${queue.length}${fire}`;
  $("#fb").style.display = "none";
  $("#fb").innerHTML = "";
  $("#tools").style.display = "flex";

  // Reset the hint for every word. (It used to stay hidden for the rest of the
  // round after one use, and in Practice it duplicated the meaning already shown.)
  const hb = $("#hintbox");
  hb.hidden = true; hb.innerHTML = "";
  $("#hint").hidden = (mode === "practice");
  // Skip works in both passes: copying out `characteristics` is a chore too when
  // you type slowly, and being stuck on one word is what makes him give up.
  $("#skip").hidden = !!solo;

  const ans = $("#ans");
  ans.value=""; ans.classList.remove("bad"); ans.disabled=false;

  if(mode==="practice"){
    $("#stage").innerHTML = `
      <div class="word">${o.w}</div>
      ${o.c ? `<div class="chunks">${o.c}</div>` : ""}
      <div class="mean">${o.m}</div>`;
    say(o.w);
  } else {
    // The word is NOT shown. That's the entire point.
    // Fixed three dots — a length-matched row would quietly leak the answer.
    const veil = `<div class="hidden-word">• • •</div>`;
    $("#stage").innerHTML = veil;
    if(noVoice){
      // No speech available: flash it briefly, then hide.
      $("#stage").innerHTML = `<div class="word">${o.w}</div>`;
      setTimeout(()=>{
        if(phase==="input" && current()===o) $("#stage").innerHTML = veil;
      }, 2000);
    } else {
      say(o.w);
    }
  }
  ans.focus();
}

/* A miss doesn't skip ahead: he types it again, correctly, before moving on.
   The correct spelling stays on screen during the fix — that step is the
   correction, not the test. The real test is the cold re-ask a few words
   later, which the requeue below sets up. */
function submit(){
  if(phase==="feedback") return step2();

  const o = current();
  const typed = $("#ans").value;
  if(!norm(typed)) return;

  const ok  = norm(typed) === norm(o.w);
  const s   = stats[o.w];
  const fix = (phase === "retry");        // already got it wrong once

  // A fresh, blind ask — a miss sends the word round again, so this counts the
  // first / second / third try that the per-word star is priced on.
  if(mode==="test" && !fix) asks[o.w] = (asks[o.w]||0) + 1;

  if(ok) return accept(o, s, fix);
  return refuse(o, s, typed, fix);
}

/* correct */
function accept(o, s, fix){
  solved.add(o.w);             // counts even after a correction — he did spell it
  if(mode==="test" && !fix && !gotAt[o.w]) gotAt[o.w] = asks[o.w];
  if(!fix){
    s.tries++;                 // every first attempt counts, right or wrong,
    s.hits++;                  // so hits/tries is a real accuracy rate
    tally.right++;
    if(mode==="test") streak++;
    if(mode==="test" && !hinted) s.score = Math.min(GOAL, s.score+1);
    save();
  }
  phase="feedback";
  $("#tools").style.display="none";
  $("#ans").disabled = true;
  $("#ans").classList.remove("bad");
  $("#fb").style.display="block";
  $("#fb").innerHTML =
    `<div class="verdict good">✓ ${o.w}</div>` +
    (fix    ? `<div class="note">Fixed it — you'll see this one again later.</div>`
   : hinted ? `<div class="note">Nice — try it without the hint next time.</div>` : "");
  const g = gen;   // only advance if we're still on THIS word
  setTimeout(()=>{ if(gen===g && phase==="feedback") step2(); }, fix ? 1300 : 1100);
}

/* wrong — stay on this word until it's typed right */
function refuse(o, s, typed, fix){
  if(!fix){                                // score/queue effects happen once
    s.tries++;
    tally.wrong++;
    streak = 0;
    if(mode==="test") s.score = 0;         // a copying typo shouldn't wipe real progress
    // Missed words come back cold a few items later — that's the actual re-test.
    if(mode==="test" && !queue.slice(at+1).includes(o)){
      queue.splice(Math.min(at+3, queue.length), 0, o);
    }
  }
  if(s.errs[s.errs.length-1] !== norm(typed)) s.errs.push(norm(typed));
  if(s.errs.length>4) s.errs.shift();
  save();

  phase="retry";
  $("#tools").style.display="none";
  $("#fb").style.display="block";
  $("#fb").innerHTML =
    `<div class="verdict miss">${fix ? "Almost — look again" : "Not quite"}</div>` +
    renderDiff(norm(typed), norm(o.w)) +
    `<div class="note retry-ask">Now type it again, correctly 👇</div>
     <div class="row"><button class="mini" id="hear">🔊 Hear it</button></div>`;

  const ans = $("#ans");
  ans.disabled = false;
  ans.classList.add("bad");
  ans.value = "";
  ans.focus();
  $("#hear").onclick = ()=> saySlow(o);   // he just missed it — read it slowly
}

function step2(){ gen++; at++; step(); }

function finish(){
  gen++;                 // stop any pending timer from re-entering the round
  // Warm-up just ended -> hand off to the blind pass on the same words.
  if(solo && mode==="practice"){
    $("#ready-sub").textContent =
      "Same word — but this time you'll only hear it.";
    return show("ready");
  }
  if(levelNo && mode==="practice"){
    const L = LEVELS[levelNo-1];
    $("#ready-sub").textContent =
      `Same ${L.ws.length} words — but this time you'll only hear them.`;
    return show("ready");
  }
  /* Every blind pass rewrites the star for each word it actually got spelled —
     level, one-by-one or the whole list alike. Always the LATEST result, so the
     home screen shows how he spells the word today, not on his best day.
     A word he only got right during a correction never set gotAt: that's a miss,
     and it scores nothing. Words he never reached keep their old star. */
  if(mode==="test"){
    solved.forEach(w => { wordStars[w] = gotAt[w] ? Math.max(0, 4 - gotAt[w]) : 0; });
    save();
  }

  renderHome();

  const minutes = sessionStart ? Math.round((Date.now()-sessionStart)/60000) : 0;
  const acts = [];

  if(levelNo){
    /* Stars require actually spelling every word in the level.
       ⭐ finished it · ⭐⭐ at most one slip · ⭐⭐⭐ all right first time. */
    const L    = LEVELS[levelNo-1];
    const left = L.ws.filter(w => !solved.has(w)).length;
    const got  = left      ? 0
               : tally.wrong===0 ? 3
               : tally.wrong<=1  ? 2 : 1;

    // Latest completed run of the level, not his best — same rule as the words.
    if(got){ stars[L.n] = got; save(); }
    renderHome();

    $("#done-emoji").textContent = left ? "🌱" : got===3 ? "🏆" : got===2 ? "🎉" : "💪";
    $("#done-stars").innerHTML   = starRow(got);
    $("#done-title").textContent = left ? "Not finished yet" : `${L.name} complete!`;
    $("#done-sub").textContent   = left
      ? `You skipped ${left} word${left===1?"":"s"}. Spell all ${L.ws.length} to earn a star.`
      : got===3 ? "Every single one right — perfect level!"
                : `${tally.right} right, ${tally.wrong} to fix.`;

    if(left){
      acts.push(`<button class="btn primary" data-act="redo" style="text-align:center">↻ Try the whole level</button>`);
    } else {
      const more = LEVELS.find(x => x.n > L.n);
      if(more) acts.push(`<button class="btn primary" data-act="next" style="text-align:center">
          ${more.emoji} Next: ${more.name} →</button>`);
      acts.push(`<button class="btn" data-act="redo" style="text-align:center">↻ Play this level again</button>`);
    }
  } else if(solo){
    /* ⭐⭐⭐ right first ask · ⭐⭐ second · ⭐ third · none after that.
       finish() has already banked it above. */
    const done = solved.has(solo.w);
    const got  = done ? (wordStars[solo.w] || 0) : 0;
    const next = soloAfter(solo.w);

    $("#done-emoji").textContent = !done ? "🌱"
      : got===3 ? "🏆" : got===2 ? "🎉" : got===1 ? "💪" : "🌱";
    $("#done-stars").innerHTML   = done ? starRow(got) : "";
    $("#done-title").textContent = done ? `${solo.w} ✓` : "Not finished yet";
    $("#done-sub").textContent   = !done
      ? "Come back to this one — it still needs spelling."
      : got===3 ? "Right first try — three stars!"
      : got===2 ? "Got it on the second try — two stars."
      : got===1 ? "Got it on the third try — one star."
      : "You got there in the end. Go again for a star.";

    if(!done){
      acts.push(`<button class="btn primary" data-act="soloredo" style="text-align:center">↻ Try it again</button>`);
    } else if(next){
      acts.push(`<button class="btn primary" data-act="solonext" style="text-align:center">Next word: ${next.w} →</button>`);
      acts.push(`<button class="btn" data-act="soloredo" style="text-align:center">↻ This word again</button>`);
    } else {
      acts.push(`<button class="btn primary" data-act="soloredo" style="text-align:center">↻ This word again</button>`);
    }
  } else {
    const need = WORDS.filter(o=>stats[o.w].score<GOAL).length;
    const perfect = tally.wrong===0 && tally.right>0;
    $("#done-emoji").textContent = perfect ? "🏆" : need===0 ? "🎉" : "💪";
    $("#done-stars").innerHTML   = "";
    $("#done-title").textContent =
      perfect ? "Perfect round!" : need===0 ? "Every word done!" : "Good work";
    $("#done-sub").textContent =
      `${tally.right} right, ${tally.wrong} to fix.` +
      (need ? ` ${need} word${need===1?"":"s"} left to nail.` : " Ready for Friday.");
  }

  // ~15 minutes in, stop being a taskmaster and send him off to play.
  const box = $("#done-break");
  if(minutes >= 13){
    box.hidden = false;
    box.textContent = `🎈 You've been working ${minutes} minutes — time for a break!`;
    acts.length = 0;                       // make stopping the obvious choice
    acts.push(`<button class="btn primary" data-act="home" style="text-align:center">Done for today 🎈</button>`);
    acts.push(`<button class="btn" data-act="${solo ? "solonext" : "next"}" style="text-align:center">${solo ? "One more word" : "One more level"}</button>`);
  } else {
    box.hidden = true;
  }

  acts.push(`<button class="btn" data-act="home" style="text-align:center">🏠 Home</button>`);
  $("#done-actions").innerHTML = acts.join("");
  $$("[data-act]").forEach(b => b.onclick = ()=>{
    const a = b.dataset.act;
    // New words -> warm up first. Same words again -> he just did them, go straight to the test.
    if(a==="next"){ const m = LEVELS.find(x=>x.n>levelNo); return m ? startLevel(m.n,"practice") : goHome(); }
    if(a==="redo") return startLevel(levelNo, "test");
    // New word -> warm up first. Same word again -> he just saw it, go straight to the test.
    if(a==="solonext"){ const n = solo && soloAfter(solo.w); return n ? startSolo(n.w,"practice") : goHome(); }
    if(a==="soloredo") return startSolo(solo.w, "test");
    goHome();
  });

  show("done");
}

function goHome(){ renderHome(); show("home"); }

/* ============================================================
   Wiring
   ============================================================ */
setWeek(defaultWeek());
renderAll();

$("#go").onclick = ()=>{
  // Prime the speech engine inside a user gesture (Safari requires this).
  if(canSpeak){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); }catch(e){} }
  pickVoice();
  show("home");
};

$("#ready-go").onclick     = ()=> solo ? startSoloTest() : startTestPass();
$("#ready-later").onclick  = goHome;
$("#test-all").onclick     = ()=> startRound("test");
$("#practice-all").onclick = ()=> startRound("practice");

/* Three ways to work: short levels, one word at a time, or the whole list.
   Remembered between visits. */
function setView(v){
  view = v;
  $$("[data-view-panel]").forEach(p => p.hidden = (p.dataset.viewPanel !== v));
  $$("#seg button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  save();
}
$$("#seg button").forEach(b => b.onclick = ()=> setView(b.dataset.view));
setView(view);

$("#ans").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    // stopPropagation matters: without it this same keypress bubbles to the
    // document handler below, which — now that phase is "feedback" — would
    // fire step2() instantly and skip the ✓ / correction message.
    e.preventDefault(); e.stopPropagation();
    submit();
  }
});
document.addEventListener("keydown", e=>{
  if($("#round").classList.contains("on") && phase==="feedback" && e.key==="Enter"){
    e.preventDefault(); step2();
  }
});

$("#again").onclick = ()=> say(current().w);
$("#slow").onclick  = ()=> saySlow(current());
/* Hint reveals the meaning once, into its own box — never stacking, and only
   in Test, where the meaning isn't already on screen. */
$("#hint").onclick = ()=>{
  const o = current(), hb = $("#hintbox");
  hinted = true;
  hb.innerHTML = o.m + (o.c ? ` &middot; <span class="chunks">${o.c}</span>` : "");
  hb.hidden = false;
  $("#hint").hidden = true;
  $("#ans").focus();
};

/* "Later" defers a word, it does not drop it — Kai's rule: you don't finish a
   level by skipping, every word has to be spelled. No penalty, it just goes to
   the back of the queue and will come round again. Finish is the way out. */
$("#skip").onclick = ()=>{
  const o = current();
  stats[o.w].skips = (stats[o.w].skips||0) + 1;
  save();
  queue.push(o);
  streak = 0;
  step2();
};

/* Leaving early must not award stars for a level he didn't finish — word
   scores are saved as he goes, so nothing is lost by just going home. */
$("#quit").onclick = ()=> levelNo ? goHome() : finish();
$("#reset").onclick = ()=>{
  if(!confirm(`Clear progress for ${WEEK}?`)) return;
  wipe();
  setView(view);
  renderAll();
};
</script>
